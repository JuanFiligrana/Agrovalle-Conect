<text x="75.0" y="117.5" font-size="36" fill="#24354b" text-anchor="start" dominant-baseline="central" font-weight="bold" text-decoration="none">Envíos, trazabilidad y precios</text>
<text x="75.0" y="175.0" font-size="22" fill="#526477" text-anchor="start" dominant-baseline="central" font-weight="normal" text-decoration="none">HU-03, HU-12, HU-13, HU-14 y HU-15 · Historial del pedido y ventas completadas</text>
<text x="75.0" y="1832.0" font-size="19" fill="#526477" text-anchor="start" dominant-baseline="central" font-weight="normal" text-decoration="none">Lectura: (mín., máx.) junto a una entidad = cuántas veces participa cada instancia en esa relación.</text>
<text x="75.0" y="1868.0" font-size="18" fill="#526477" text-anchor="start" dominant-baseline="central" font-weight="normal" text-decoration="none">Clave subrayada · Óvalo discontinuo: atributo calculado · Gris: entidad repetida de otra vista · N: muchos</text>
<text x="595.0" y="374.0" font-size="20" fill="#24354b" text-anchor="middle" dominant-baseline="central" font-weight="normal" text-decoration="none">(0,1)</text>
<text x="1305.0" y="374.0" font-size="20" fill="#24354b" text-anchor="middle" dominant-baseline="central" font-weight="normal" text-decoration="none">(1,1)</text>
<text x="460.0" y="493.0" font-size="20" fill="#24354b" text-anchor="middle" dominant-baseline="central" font-weight="normal" text-decoration="none">(1,N)</text>
<text x="460.0" y="1007.0" font-size="20" fill="#24354b" text-anchor="middle" dominant-baseline="central" font-weight="normal" text-decoration="none">(1,1)</text>
<text x="595.0" y="1074.0" font-size="20" fill="#24354b" text-anchor="middle" dominant-baseline="central" font-weight="normal" text-decoration="none">(0,N)</text>
<text x="1305.0" y="1074.0" font-size="20" fill="#24354b" text-anchor="middle" dominant-baseline="central" font-weight="normal" text-decoration="none">(0,1)</text>
<text x="75.0" y="1531.0" font-size="21" fill="#526477" text-anchor="start" dominant-baseline="central" font-weight="normal" text-decoration="none">Eventos del pedido: PENDIENTE → LISTO_PARA_DESPACHO → EN_CAMINO → ENTREGADO; PENDIENTE → CANCELADA.</text>
<text x="75.0" y="1591.0" font-size="20" fill="#526477" text-anchor="start" dominant-baseline="central" font-weight="normal" text-decoration="none">El envío es opcional mientras el pedido está pendiente. La trazabilidad se conserva incluso si el pedido se cancela antes del despacho.</text>
<text x="75.0" y="1671.0" font-size="20" fill="#526477" text-anchor="start" dominant-baseline="central" font-weight="normal" text-decoration="none">HU-03 · Decisión de diseño: una transacción completada es una línea de pedido ENTREGADO, con su precio histórico en COP/kg.</text>
<text x="75.0" y="1721.0" font-size="20" fill="#526477" text-anchor="start" dominant-baseline="central" font-weight="normal" text-decoration="none">Promedio de producto = suma de precios unitarios de esas líneas / número de líneas, con fecha_completado en las últimas 24 horas.</text>
<text x="75.0" y="1771.0" font-size="20" fill="#526477" text-anchor="start" dominant-baseline="central" font-weight="normal" text-decoration="none">Promedio no ponderado; redondeo a 2 decimales. Sin ventas: promedio null y cantidad 0. No se requieren pagos reales ni GPS.</text>

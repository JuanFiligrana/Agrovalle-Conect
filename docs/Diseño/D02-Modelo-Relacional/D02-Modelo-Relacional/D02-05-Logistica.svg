<text x="78" y="1531.0" dominant-baseline="central" text-anchor="start" fill="#526477" font-size="21" font-weight="normal">Los eventos conservan los estados históricos y su fecha; el estado actual del pedido se valida en el servicio.</text>
<text x="78" y="1591.0" dominant-baseline="central" text-anchor="start" fill="#526477" font-size="21" font-weight="normal">Estados: PENDIENTE → LISTO_PARA_DESPACHO → EN_CAMINO → ENTREGADO, o PENDIENTE → CANCELADA.</text>
<text x="78" y="1651.0" dominant-baseline="central" text-anchor="start" fill="#526477" font-size="21" font-weight="normal">La programación futura del envío se comprueba al realizar la operación; no se usa un CHECK que dependa de hoy.</text>
<text x="78" y="1775.0" dominant-baseline="central" text-anchor="start" fill="#526477" font-size="19" font-weight="normal">PK: primaria · FK: foránea · UQ: única · NN / Nulo NO: obligatorio · UQ*: índice único sobre correo normalizado</text>
<text x="78" y="1813.0" dominant-baseline="central" text-anchor="start" fill="#526477" font-size="18" font-weight="normal">Extremos: 1 = uno; 0..1 = opcional; 0..N = varios; 1..N = uno o más. Los mínimos de colecciones requieren la operación transaccional.</text>

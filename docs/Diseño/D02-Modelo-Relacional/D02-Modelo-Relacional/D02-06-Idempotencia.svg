<text x="78" y="1421.0" dominant-baseline="central" text-anchor="start" fill="#526477" font-size="21" font-weight="normal">PK compuesta: (id_comprador, clave). id_pedido es también único; el servicio comprueba que pertenezca al mismo comprador.</text>
<text x="78" y="1491.0" dominant-baseline="central" text-anchor="start" fill="#526477" font-size="21" font-weight="normal">v_disponibilidad: cantidad física − reservas activas no vencidas. No se almacena una copia del resultado.</text>
<text x="78" y="1551.0" dominant-baseline="central" text-anchor="start" fill="#526477" font-size="21" font-weight="normal">v_total_pedido: suma de subtotales, con cada línea redondeada a dos decimales en COP.</text>
<text x="78" y="1611.0" dominant-baseline="central" text-anchor="start" fill="#526477" font-size="21" font-weight="normal">v_precios_24h: promedio no ponderado del precio histórico de líneas entregadas en 24 horas; sin ventas: NULL y cantidad 0.</text>
<text x="78" y="1671.0" dominant-baseline="central" text-anchor="start" fill="#526477" font-size="21" font-weight="normal">Las vistas son consultas. No cuentan como tablas base adicionales ni se editan como datos del negocio.</text>
<text x="78" y="1775.0" dominant-baseline="central" text-anchor="start" fill="#526477" font-size="19" font-weight="normal">PK: primaria · FK: foránea · UQ: única · NN / Nulo NO: obligatorio · UQ*: índice único sobre correo normalizado</text>
<text x="78" y="1813.0" dominant-baseline="central" text-anchor="start" fill="#526477" font-size="18" font-weight="normal">Extremos: 1 = uno; 0..1 = opcional; 0..N = varios; 1..N = uno o más. Los mínimos de colecciones requieren la operación transaccional.</text>
</g></svg>
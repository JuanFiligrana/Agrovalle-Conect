<text x="80" y="376.0" text-anchor="start" dominant-baseline="central" font-size="32" font-weight="700" fill="#1b5137">Aún no hay datos de este producto</text>
<text x="80" y="445.0" text-anchor="start" dominant-baseline="central" font-size="20" font-weight="400" fill="#53675a">No hay ventas completadas de cacao en las últimas 24 horas. No se puede calcular un promedio.</text>
<text x="80" y="515.5" text-anchor="start" dominant-baseline="central" font-size="20" font-weight="700" fill="#1b5137">Promedio: Sin datos · Registros de ventas: 0</text>
<rect x="80" y="552" width="360" height="52" rx="8" fill="#ffffff" stroke="#1b5137" stroke-width="1.3"/>
<text x="260.0" y="578.0" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="700" fill="#1b5137">Consultar otro producto</text>
<rect x="40" y="664" width="1520" height="516" rx="14" fill="#ffffff" stroke="#d5dfd1" stroke-width="1.3"/>
<text x="66" y="696.0" text-anchor="start" dominant-baseline="central" font-size="17" font-weight="700" fill="#53675a">HU04 · Ninguna oferta activa cumple ambos filtros</text>
<line x1="66" y1="727" x2="1534" y2="727" stroke="#d5dfd1" stroke-width="1"/>
<text x="80" y="771.0" text-anchor="start" dominant-baseline="central" font-size="29" font-weight="700" fill="#1b5137">Cosechas cerca de tu negocio</text>
<rect x="80" y="811" width="180" height="34" rx="17" fill="#e9efdf" stroke="none" stroke-width="1.3"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1620" viewBox="0 0 1600 1620">
<rect width="1600" height="1620" fill="#f1f4f0"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="40" y="44.0" text-anchor="start" dominant-baseline="central" font-size="29" font-weight="700" fill="#153b2b">D07 / 07 · Estados de las consultas</text>
<text x="40" y="90.0" text-anchor="start" dominant-baseline="central" font-size="17" font-weight="400" fill="#53675a">HU03 y HU04 · Consultas sin datos y filtro inválido · Se mantiene la selección para corregirla</text>
<rect x="1370" y="33" width="190" height="34" rx="17" fill="#e9efdf" stroke="none" stroke-width="1.3"/>
<text x="1465.0" y="50.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#1b5137">PROPUESTA</text>
<text x="40" y="1589.5" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="400" fill="#53675a">AgroValle Connect · Diseño objetivo · Datos de ejemplo ficticios · Sprint de diseño · 17/10/2026</text>
<rect x="40" y="140" width="1520" height="486" rx="14" fill="#ffffff" stroke="#d5dfd1" stroke-width="1.3"/>
<text x="66" y="172.0" text-anchor="start" dominant-baseline="central" font-size="17" font-weight="700" fill="#53675a">HU03 · El producto no tiene ventas completadas en las últimas 24 horas</text>
<line x1="66" y1="203" x2="1534" y2="203" stroke="#d5dfd1" stroke-width="1"/>
<text x="80" y="247.0" text-anchor="start" dominant-baseline="central" font-size="29" font-weight="700" fill="#1b5137">Precios de referencia</text>

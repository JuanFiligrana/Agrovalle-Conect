<rect x="280" y="811" width="180" height="34" rx="17" fill="#e9efdf" stroke="none" stroke-width="1.3"/>
<text x="370.0" y="828.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#1b5137">Frutas</text>
<text x="80" y="903.0" text-anchor="start" dominant-baseline="central" font-size="30" font-weight="700" fill="#1b5137">No encontramos cosechas con estos filtros</text>
<text x="80" y="982.0" text-anchor="start" dominant-baseline="central" font-size="20" font-weight="400" fill="#53675a">No hay ofertas activas que coincidan con municipio Dagua y categoría Frutas. Prueba otra combinación.</text>
<rect x="80" y="1066" width="360" height="52" rx="8" fill="#ffffff" stroke="#1b5137" stroke-width="1.3"/>

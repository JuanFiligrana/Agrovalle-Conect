<line x1="66" y1="1279" x2="1534" y2="1279" stroke="#d5dfd1" stroke-width="1"/>
<rect x="80" y="1299" width="1440" height="117" rx="10" fill="#fff3f0" stroke="none" stroke-width="1.3"/>
<text x="98" y="1328.5" text-anchor="start" dominant-baseline="central" font-size="20" font-weight="700" fill="#a22e27">Revisa la categoría seleccionada</text>
<text x="98" y="1379.0" text-anchor="start" dominant-baseline="central" font-size="17" font-weight="400" fill="#a22e27">Esa categoría no está disponible. Selecciona una categoría válida para volver a buscar.</text>
<rect x="80" y="1440" width="360" height="52" rx="8" fill="#ffffff" stroke="#1b5137" stroke-width="1.3"/>
<text x="260.0" y="1466.0" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="700" fill="#1b5137">Seleccionar categoría</text>

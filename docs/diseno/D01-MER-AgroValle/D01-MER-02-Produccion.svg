<text x="75.0" y="1801.0" font-size="20" fill="#526477" text-anchor="start" dominant-baseline="central" font-weight="normal" text-decoration="none">Disponibilidad = cantidad física − reservas activas no vencidas. El promedio se calcula con ventas completadas; ver vista 05.</text>

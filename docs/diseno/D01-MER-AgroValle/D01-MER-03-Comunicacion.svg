<text x="75.0" y="1982.0" font-size="19" fill="#526477" text-anchor="start" dominant-baseline="central" font-weight="normal" text-decoration="none">Lectura: (mín., máx.) junto a una entidad = cuántas veces participa cada instancia en esa relación.</text>

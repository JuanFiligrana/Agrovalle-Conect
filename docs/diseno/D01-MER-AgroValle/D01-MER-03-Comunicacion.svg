<text x="75.0" y="1916.0" font-size="20" fill="#526477" text-anchor="start" dominant-baseline="central" font-weight="normal" text-decoration="none">El destinatario del aviso de contacto es el agricultor dueño de la cosecha. La fecha del contacto no es la fecha del envío.</text>

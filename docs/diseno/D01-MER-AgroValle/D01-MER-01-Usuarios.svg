<text x="75.0" y="55.0" font-size="18" fill="#526477" text-anchor="start" dominant-baseline="central" font-weight="normal" text-decoration="none">AGROVALLE CONNECT  /  D01  /  MODELO CONCEPTUAL</text>
<text x="75.0" y="117.5" font-size="36" fill="#24354b" text-anchor="start" dominant-baseline="central" font-weight="bold" text-decoration="none">Usuarios y ubicación</text>
<text x="75.0" y="175.0" font-size="22" fill="#526477" text-anchor="start" dominant-baseline="central" font-weight="normal" text-decoration="none">HU-01, HU-06 y HU-07 · Datos comunes y especialización de cuentas</text>
<text x="75.0" y="1832.0" font-size="19" fill="#526477" text-anchor="start" dominant-baseline="central" font-weight="normal" text-decoration="none">Lectura: (mín., máx.) junto a una entidad = cuántas veces participa cada instancia en esa relación.</text>
<text x="75.0" y="1868.0" font-size="18" fill="#526477" text-anchor="start" dominant-baseline="central" font-weight="normal" text-decoration="none">Clave subrayada · Óvalo discontinuo: atributo calculado · Gris: entidad repetida de otra vista · N: muchos</text>
<text x="1200.0" y="900.0" font-size="21" fill="#526477" text-anchor="middle" dominant-baseline="central" font-weight="normal" text-decoration="none">total y disjunta</text>
<text x="710.0" y="1163.0" font-size="20" fill="#24354b" text-anchor="middle" dominant-baseline="central" font-weight="normal" text-decoration="none">(1,1)</text>
<text x="710.0" y="1417.0" font-size="20" fill="#24354b" text-anchor="middle" dominant-baseline="central" font-weight="normal" text-decoration="none">(0,N)</text>
<text x="1390.0" y="1231.0" font-size="21" fill="#526477" text-anchor="start" dominant-baseline="central" font-weight="normal" text-decoration="none">AGRICULTOR y COMPRADOR heredan id_usuario y los datos comunes.</text>
<text x="1390.0" y="1291.0" font-size="21" fill="#526477" text-anchor="start" dominant-baseline="central" font-weight="normal" text-decoration="none">UQ: la cédula del agricultor y el correo de usuario son únicos.</text>
<text x="1390.0" y="1351.0" font-size="21" fill="#526477" text-anchor="start" dominant-baseline="central" font-weight="normal" text-decoration="none">Decisión de diseño: cada cuenta pertenece a un solo rol.</text>
<text x="1390.0" y="1411.0" font-size="21" fill="#526477" text-anchor="start" dominant-baseline="central" font-weight="normal" text-decoration="none">Si se requieren cuentas multirrol, se revisará esta especialización.</text>
<text x="1390.0" y="1531.0" font-size="21" fill="#526477" text-anchor="start" dominant-baseline="central" font-weight="normal" text-decoration="none">El municipio de residencia puede diferir del municipio de la finca.</text>
<text x="75.0" y="1711.0" font-size="21" fill="#526477" text-anchor="start" dominant-baseline="central" font-weight="normal" text-decoration="none">La doble línea hacia ISA indica que toda cuenta pertenece a uno de los dos subtipos. La contraseña se almacena como hash.</text>

<text x="75.0" y="2282.0" font-size="19" fill="#526477" text-anchor="start" dominant-baseline="central" font-weight="normal" text-decoration="none">Lectura: (mín., máx.) junto a una entidad = cuántas veces participa cada instancia en esa relación.</text>
<text x="75.0" y="2318.0" font-size="18" fill="#526477" text-anchor="start" dominant-baseline="central" font-weight="normal" text-decoration="none">Clave subrayada · Óvalo discontinuo: atributo calculado · Gris: entidad repetida de otra vista · N: muchos</text>

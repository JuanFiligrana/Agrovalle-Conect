<text x="75.0" y="2191.0" font-size="20" fill="#526477" text-anchor="start" dominant-baseline="central" font-weight="normal" text-decoration="none">Cada pedido conserva el comprador de su carrito de origen y pertenece a un solo agricultor. Todas sus líneas deben corresponder a ese agricultor.</text>
<text x="75.0" y="2231.0" font-size="20" fill="#526477" text-anchor="start" dominant-baseline="central" font-weight="normal" text-decoration="none">RESERVA es el ítem del carrito: activa, consumida o vencida. Al confirmar, genera un detalle con cantidad y precio histórico inmutables.</text>

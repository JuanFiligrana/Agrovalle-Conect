<text x="228.0" y="837.0" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="700" fill="#ffffff">Iniciar sesión</text>
<text x="68" y="881.0" text-anchor="start" dominant-baseline="central" font-size="15" font-weight="400" fill="#53675a">El registro no inicia una sesión automáticamente.</text>

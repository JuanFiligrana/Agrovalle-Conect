<rect x="820" y="552" width="740" height="370" rx="14" fill="#ffffff" stroke="#d5dfd1" stroke-width="1.3"/>
<text x="846" y="584.0" text-anchor="start" dominant-baseline="central" font-size="17" font-weight="700" fill="#53675a">HU05 · Oferta inexistente o inactiva</text>
<line x1="846" y1="615" x2="1534" y2="615" stroke="#d5dfd1" stroke-width="1"/>
<rect x="40" y="964" width="740" height="370" rx="14" fill="#ffffff" stroke="#d5dfd1" stroke-width="1.3"/>
<text x="66" y="996.0" text-anchor="start" dominant-baseline="central" font-size="17" font-weight="700" fill="#53675a">HU05 · Mensaje inválido</text>
<line x1="66" y1="1027" x2="754" y2="1027" stroke="#d5dfd1" stroke-width="1"/>
<rect x="820" y="964" width="740" height="370" rx="14" fill="#ffffff" stroke="#d5dfd1" stroke-width="1.3"/>
<text x="846" y="996.0" text-anchor="start" dominant-baseline="central" font-size="17" font-weight="700" fill="#53675a">HU05 · Fallo transaccional gestionado</text>
<line x1="846" y1="1027" x2="1534" y2="1027" stroke="#d5dfd1" stroke-width="1"/>
<rect x="68" y="222" width="684" height="156" rx="10" fill="#e9efdf" stroke="none" stroke-width="1.3"/>
<text x="86" y="251.5" text-anchor="start" dominant-baseline="central" font-size="20" font-weight="700" fill="#1b5137">Tu solicitud quedó registrada</text>
<text x="86" y="310.025" text-anchor="start" dominant-baseline="central" font-size="17" font-weight="400" fill="#1b5137">Interacción #548. Se registró un aviso interno para Luis Andrés Rojas sobre</text>
<text x="86" y="332.97499999999997" text-anchor="start" dominant-baseline="central" font-size="17" font-weight="400" fill="#1b5137">la oferta #101.</text>
<rect x="68" y="417" width="330" height="52" rx="8" fill="#ffffff" stroke="#1b5137" stroke-width="1.3"/>
<text x="233.0" y="443.0" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="700" fill="#1b5137">Volver a las cosechas</text>
<rect x="848" y="222" width="684" height="156" rx="10" fill="#fff7df" stroke="none" stroke-width="1.3"/>
<text x="866" y="251.5" text-anchor="start" dominant-baseline="central" font-size="20" font-weight="700" fill="#805b0c">Inicia sesión para continuar</text>
<text x="866" y="310.025" text-anchor="start" dominant-baseline="central" font-size="17" font-weight="400" fill="#805b0c">Necesitas una cuenta de comprador para enviar una solicitud a este</text>
<text x="866" y="332.97499999999997" text-anchor="start" dominant-baseline="central" font-size="17" font-weight="400" fill="#805b0c">agricultor.</text>
<rect x="848" y="417" width="320" height="52" rx="8" fill="#1b5137" stroke="#1b5137" stroke-width="1.3"/>
<text x="1008.0" y="443.0" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="700" fill="#ffffff">Iniciar sesión</text>
<rect x="68" y="634" width="684" height="156" rx="10" fill="#fff3f0" stroke="none" stroke-width="1.3"/>
<text x="86" y="663.5" text-anchor="start" dominant-baseline="central" font-size="20" font-weight="700" fill="#a22e27">Esta función es para compradores</text>
<text x="86" y="722.025" text-anchor="start" dominant-baseline="central" font-size="17" font-weight="400" fill="#a22e27">Tu cuenta de agricultor no puede enviar esta solicitud. Puedes volver a</text>
<text x="86" y="744.975" text-anchor="start" dominant-baseline="central" font-size="17" font-weight="400" fill="#a22e27">explorar las cosechas.</text>
<rect x="68" y="829" width="330" height="52" rx="8" fill="#ffffff" stroke="#1b5137" stroke-width="1.3"/>
<text x="233.0" y="855.0" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="700" fill="#1b5137">Volver a las cosechas</text>
<rect x="848" y="634" width="684" height="156" rx="10" fill="#fff3f0" stroke="none" stroke-width="1.3"/>
<text x="866" y="663.5" text-anchor="start" dominant-baseline="central" font-size="20" font-weight="700" fill="#a22e27">Esta oferta ya no está disponible</text>
<text x="866" y="722.025" text-anchor="start" dominant-baseline="central" font-size="17" font-weight="400" fill="#a22e27">No se registró la solicitud. Vuelve a las cosechas para elegir otra oferta</text>
<text x="866" y="744.975" text-anchor="start" dominant-baseline="central" font-size="17" font-weight="400" fill="#a22e27">activa.</text>
<rect x="848" y="829" width="330" height="52" rx="8" fill="#ffffff" stroke="#1b5137" stroke-width="1.3"/>
<text x="1013.0" y="855.0" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="700" fill="#1b5137">Explorar cosechas</text>
<text x="68" y="1067.0" text-anchor="start" dominant-baseline="central" font-size="19" font-weight="700" fill="#153b2b">Tu mensaje</text>
<rect x="68" y="1100" width="684" height="95" rx="8" fill="#ffffff" stroke="#a22e27" stroke-width="1.3"/>
<text x="86" y="1143.0" text-anchor="start" dominant-baseline="central" font-size="18" font-weight="400" fill="#53675a">Escribe tu solicitud…</text>
<text x="68" y="1238.0" text-anchor="start" dominant-baseline="central" font-size="17" font-weight="400" fill="#a22e27">El mensaje es obligatorio y debe tener como máximo 1000 caracteres.</text>
<rect x="848" y="1046" width="684" height="156" rx="10" fill="#fff3f0" stroke="none" stroke-width="1.3"/>
<text x="866" y="1075.5" text-anchor="start" dominant-baseline="central" font-size="20" font-weight="700" fill="#a22e27">No pudimos completar el envío</text>
<text x="866" y="1134.025" text-anchor="start" dominant-baseline="central" font-size="17" font-weight="400" fill="#a22e27">No se registraron cambios. Conservamos tu mensaje para que puedas</text>
<text x="866" y="1156.9750000000001" text-anchor="start" dominant-baseline="central" font-size="17" font-weight="400" fill="#a22e27">intentarlo de nuevo.</text>
<rect x="848" y="1241" width="320" height="52" rx="8" fill="#ffffff" stroke="#1b5137" stroke-width="1.3"/>
<text x="1008.0" y="1267.0" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="700" fill="#1b5137">Volver a intentar</text>
</g></svg>
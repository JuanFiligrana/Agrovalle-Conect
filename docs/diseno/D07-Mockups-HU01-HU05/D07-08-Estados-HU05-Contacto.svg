<g font-family="DejaVu Sans, sans-serif">
<text x="40" y="44.0" text-anchor="start" dominant-baseline="central" font-size="29" font-weight="700" fill="#153b2b">D07 / 08 · Estados del contacto</text>
<text x="40" y="90.0" text-anchor="start" dominant-baseline="central" font-size="17" font-weight="400" fill="#53675a">HU05 · El éxito solo se muestra al confirmar el registro del mensaje y de la notificación interna</text>
<rect x="1370" y="33" width="190" height="34" rx="17" fill="#e9efdf" stroke="none" stroke-width="1.3"/>
<text x="1465.0" y="50.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#1b5137">PROPUESTA</text>
<text x="40" y="1419.5" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="400" fill="#53675a">AgroValle Connect · Diseño objetivo · Datos de ejemplo ficticios · Sprint de diseño · 17/10/2026</text>
<rect x="40" y="140" width="740" height="370" rx="14" fill="#ffffff" stroke="#d5dfd1" stroke-width="1.3"/>

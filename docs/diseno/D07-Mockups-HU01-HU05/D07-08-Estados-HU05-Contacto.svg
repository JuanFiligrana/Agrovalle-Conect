<rect x="820" y="140" width="740" height="370" rx="14" fill="#ffffff" stroke="#d5dfd1" stroke-width="1.3"/>
<text x="846" y="172.0" text-anchor="start" dominant-baseline="central" font-size="17" font-weight="700" fill="#53675a">HU05 · Sesión ausente o vencida</text>
<line x1="846" y1="203" x2="1534" y2="203" stroke="#d5dfd1" stroke-width="1"/>
<rect x="40" y="552" width="740" height="370" rx="14" fill="#ffffff" stroke="#d5dfd1" stroke-width="1.3"/>
<text x="66" y="584.0" text-anchor="start" dominant-baseline="central" font-size="17" font-weight="700" fill="#53675a">HU05 · Rol no autorizado</text>

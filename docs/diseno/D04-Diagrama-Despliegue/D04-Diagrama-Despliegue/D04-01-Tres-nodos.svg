<text x="1140.0" y="641.5" text-anchor="middle" dominant-baseline="central" font-size="20" fill="#536579" font-weight="400">HTTPS sobre TLS / TCP · puerto de destino 443</text><text x="1140.0" y="668.5" text-anchor="middle" dominant-baseline="central" font-size="20" fill="#536579" font-weight="400">Interfaz web y API REST; respuestas HTML o JSON</text>
<path d="M 1140 980 L 1140 1100" fill="none" stroke="#536579" stroke-width="2.5"/>
<rect x="460" y="1005" width="1360" height="65" rx="6" fill="white"/>
<text x="1140.0" y="1037.5" text-anchor="middle" dominant-baseline="central" font-size="20" fill="#536579" font-weight="400">HTTP / TCP · destino 127.0.0.1:8081 · comunicación interna del mismo servidor</text>
<path d="M 1140 1370 L 1140 1670" fill="none" stroke="#536579" stroke-width="2.5"/>
<rect x="460" y="1480" width="1360" height="70" rx="6" fill="white"/>
<text x="1140.0" y="1501.5" text-anchor="middle" dominant-baseline="central" font-size="20" fill="#536579" font-weight="400">Protocolo PostgreSQL sobre TLS / TCP · puerto de destino 5432</text><text x="1140.0" y="1528.5" text-anchor="middle" dominant-baseline="central" font-size="20" fill="#536579" font-weight="400">Acceso desde Java mediante JDBC · red privada</text>
<text x="72" y="75.0" text-anchor="start" dominant-baseline="central" font-size="36" fill="#24364a" font-weight="700">D04 / Despliegue UML de AgroValle Connect</text>
<text x="72" y="140.0" text-anchor="start" dominant-baseline="central" font-size="20" fill="#536579" font-weight="400">Diseño objetivo en tres nodos · Servidores, proxy HTTPS e integración PostgreSQL propuestos; aún por implementar</text>
<text x="104" y="301.3" text-anchor="start" dominant-baseline="central" font-size="24" fill="#245e96" font-weight="700">«device»</text><text x="104" y="333.70000000000005" text-anchor="start" dominant-baseline="central" font-size="24" fill="#245e96" font-weight="700">Nodo 1 · Cliente</text>
<text x="104" y="431.65" text-anchor="start" dominant-baseline="central" font-size="21" fill="#536579" font-weight="400">PC, celular o tableta</text><text x="104" y="460.0" text-anchor="start" dominant-baseline="central" font-size="21" fill="#536579" font-weight="400">Vista en el navegador</text><text x="104" y="488.34999999999997" text-anchor="start" dominant-baseline="central" font-size="21" fill="#536579" font-weight="400">Acceso a la aplicación</text>
<text x="1140.0" y="322.0" text-anchor="middle" dominant-baseline="central" font-size="20" fill="#245e96" font-weight="400">«executionEnvironment»</text>
<text x="1140.0" y="363.0" text-anchor="middle" dominant-baseline="central" font-size="25" fill="#245e96" font-weight="700">Navegador web</text>
<text x="1131.0" y="412.0" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#245e96" font-weight="400">«artifact»</text>
<text x="1131.0" y="447.0" text-anchor="middle" dominant-baseline="central" font-size="22" fill="#24364a" font-weight="700">index.html + CSS / JavaScript</text>
<text x="1137.5" y="487.0" text-anchor="middle" dominant-baseline="central" font-size="18" fill="#536579" font-weight="400">Recursos recibidos del servidor; consulta y envío de datos JSON</text>
<text x="104" y="801.3" text-anchor="start" dominant-baseline="central" font-size="24" fill="#266c50" font-weight="700">«device»</text><text x="104" y="833.6999999999999" text-anchor="start" dominant-baseline="central" font-size="24" fill="#266c50" font-weight="700">Nodo 2 · Aplicación</text>
<text x="104" y="931.65" text-anchor="start" dominant-baseline="central" font-size="21" fill="#536579" font-weight="400">Servidor Linux</text><text x="104" y="960.0" text-anchor="start" dominant-baseline="central" font-size="21" fill="#536579" font-weight="400">Proxy y JVM en</text><text x="104" y="988.35" text-anchor="start" dominant-baseline="central" font-size="21" fill="#536579" font-weight="400">el mismo equipo</text>
<text x="1140.0" y="832.0" text-anchor="middle" dominant-baseline="central" font-size="20" fill="#266c50" font-weight="400">«executionEnvironment»</text>
<text x="1140.0" y="873.0" text-anchor="middle" dominant-baseline="central" font-size="25" fill="#266c50" font-weight="700">NGINX · terminación TLS [propuesto]</text>
<text x="1140.0" y="932.5" text-anchor="middle" dominant-baseline="central" font-size="20" fill="#24364a" font-weight="400">Recibe HTTPS en 443 y reenvía al proceso Spring Boot por loopback</text>
<text x="1140.0" y="1132.0" text-anchor="middle" dominant-baseline="central" font-size="20" fill="#266c50" font-weight="400">«executionEnvironment»</text>
<text x="1140.0" y="1173.0" text-anchor="middle" dominant-baseline="central" font-size="25" fill="#266c50" font-weight="700">JVM Java 17 LTS · Spring Boot 3.5.16 · Tomcat embebido</text>
<text x="1131.0" y="1222.0" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#266c50" font-weight="400">«artifact»</text>
<text x="1131.0" y="1257.0" text-anchor="middle" dominant-baseline="central" font-size="22" fill="#24364a" font-weight="700">agrovalle-connect-0.0.1-SNAPSHOT.jar</text>
<text x="1137.5" y="1309.5" text-anchor="middle" dominant-baseline="central" font-size="18" fill="#536579" font-weight="400">Vista estática + API REST + servicios + adaptadores JPA del diseño D03</text>
<text x="104" y="1681.3" text-anchor="start" dominant-baseline="central" font-size="24" fill="#99651e" font-weight="700">«device»</text><text x="104" y="1713.7" text-anchor="start" dominant-baseline="central" font-size="24" fill="#99651e" font-weight="700">Nodo 3 · Datos</text>
<text x="104" y="1811.65" text-anchor="start" dominant-baseline="central" font-size="21" fill="#536579" font-weight="400">Servidor de BD</text><text x="104" y="1840.0" text-anchor="start" dominant-baseline="central" font-size="21" fill="#536579" font-weight="400">Conexión privada</text><text x="104" y="1868.3500000000001" text-anchor="start" dominant-baseline="central" font-size="21" fill="#536579" font-weight="400">desde la aplicación</text>
<text x="1140.0" y="1702.0" text-anchor="middle" dominant-baseline="central" font-size="20" fill="#99651e" font-weight="400">«executionEnvironment»</text>
<text x="1140.0" y="1743.0" text-anchor="middle" dominant-baseline="central" font-size="25" fill="#99651e" font-weight="700">PostgreSQL 16 [propuesto]</text>
<text x="1131.0" y="1792.0" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#99651e" font-weight="400">«artifact»</text>
<text x="1131.0" y="1827.0" text-anchor="middle" dominant-baseline="central" font-size="22" fill="#24364a" font-weight="700">Base agrovalle_db · esquema agrovalle</text>
<text x="1137.5" y="1879.5" text-anchor="middle" dominant-baseline="central" font-size="18" fill="#536579" font-weight="400">17 tablas y 3 vistas D02 · datos, índices y restricciones relacionales</text>
<text x="72" y="2051.0" text-anchor="start" dominant-baseline="central" font-size="20" fill="#24364a" font-weight="700">«device»: equipo · «executionEnvironment»: entorno de ejecución · «artifact»: unidad desplegada</text>
<text x="72" y="2100.0" text-anchor="start" dominant-baseline="central" font-size="19" fill="#536579" font-weight="400">Línea continua: camino de comunicación. Las respuestas usan la misma conexión; no hay acceso directo cliente → BD.</text>
<text x="72" y="2143.0" text-anchor="start" dominant-baseline="central" font-size="19" fill="#536579" font-weight="400">Linux, NGINX, TLS y agrovalle_db son decisiones de diseño. Esta hoja no acredita un despliegue realizado.</text>
</g></svg>

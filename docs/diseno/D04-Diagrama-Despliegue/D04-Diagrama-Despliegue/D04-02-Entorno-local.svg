<text x="72" y="1934.675" text-anchor="start" dominant-baseline="central" font-size="19" fill="#536579" font-weight="400">Línea continua: comunicación configurada. La base remota y NGINX permanecen como diseño.</text><text x="72" y="1960.325" text-anchor="start" dominant-baseline="central" font-size="19" fill="#536579" font-weight="400">Hibernate valida el esquema y Spring Data JPA persiste usuarios, fincas y cosechas.</text>

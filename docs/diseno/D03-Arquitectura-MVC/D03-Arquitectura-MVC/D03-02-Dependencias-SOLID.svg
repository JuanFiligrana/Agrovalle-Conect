<text x="66" y="1548.85" dominant-baseline="central" text-anchor="start" font-size="18" fill="#536477" font-weight="400">Se muestra un extracto de las dependencias. Las vistas, los controladores y los demás casos están en la hoja 01.</text><text x="66" y="1573.1499999999999" dominant-baseline="central" text-anchor="start" font-size="18" fill="#536477" font-weight="400">Las transacciones y las pruebas de concurrencia siguen siendo trabajo de implementación.</text>

<text x="78" y="1471.0" dominant-baseline="central" text-anchor="start" fill="#526477" font-size="21" font-weight="normal">Agricultor y Comprador reutilizan id_usuario; las cuentas se crean junto con exactamente un subtipo.</text>
<text x="78" y="1531.0" dominant-baseline="central" text-anchor="start" fill="#526477" font-size="21" font-weight="normal">El correo tiene un índice único sobre lower(btrim(correo)). La cédula se almacena como texto.</text>
<text x="78" y="1591.0" dominant-baseline="central" text-anchor="start" fill="#526477" font-size="21" font-weight="normal">La especialización total y disjunta requiere validación transaccional; las FK por sí solas no la garantizan.</text>
<text x="78" y="1775.0" dominant-baseline="central" text-anchor="start" fill="#526477" font-size="19" font-weight="normal">PK: primaria · FK: foránea · UQ: única · NN / Nulo NO: obligatorio · UQ*: índice único sobre correo normalizado</text>
<text x="78" y="1813.0" dominant-baseline="central" text-anchor="start" fill="#526477" font-size="18" font-weight="normal">Extremos: 1 = uno; 0..1 = opcional; 0..N = varios; 1..N = uno o más. Los mínimos de colecciones requieren la operación transaccional.</text>
